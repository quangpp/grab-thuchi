<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sổ Tài Chính</title>
  <meta name="theme-color" content="#3563e9">
  <script>try { var t = localStorage.getItem('grab-theme'); if (t) document.documentElement.setAttribute('data-theme', t); } catch (e) { }</script>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Sổ Tài Chính">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top"><h1 id="title">Tổng quan</h1>
    <button id="gear" data-act="tab" data-tab="settings" aria-label="Cài đặt">
      <svg viewBox="0 0 24 24"><path d="M4 6h10M18 6h2M4 12h2M10 12h10M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="8" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>
    </button></header>
  <main id="view"></main>

  <nav id="nav" aria-label="Điều hướng">
    <button data-act="tab" data-tab="overview">
      <svg viewBox="0 0 24 24"><path d="M5 20V11M12 20V4M19 20v-6"/></svg><span>Tổng quan</span>
    </button>
    <button data-act="tab" data-tab="ledger">
      <svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg><span>Giao dịch</span>
    </button>
    <button data-act="tab" data-tab="accounts">
      <svg viewBox="0 0 24 24"><path d="M3 7h16a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7zm0 0V6a2 2 0 0 1 2-2h12"/><circle cx="16.5" cy="13.5" r="1"/></svg><span>Tài khoản</span>
    </button>
    <button data-act="tab" data-tab="plan">
      <svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg><span>Kế hoạch</span>
    </button>
    <button data-act="tab" data-tab="grab">
      <svg viewBox="0 0 24 24"><circle cx="6" cy="17" r="3"/><circle cx="18" cy="17" r="3"/><path d="M6 17h4l3-7h3l2 7M9 10h4"/></svg><span>Grab</span>
    </button>
  </nav>

  <div id="lock" hidden>
    <div class="lock-box">
      <div class="lock-ico">🔒</div>
      <h1>Sổ Tài Chính</h1>
      <p class="muted">Nhập mật khẩu để mở dữ liệu</p>
      <form id="lockForm" autocomplete="on">
        <input type="text" name="username" value="grab-thuchi" autocomplete="username" tabindex="-1" aria-hidden="true" class="vh">
        <input id="lockPw" type="password" name="password" autocomplete="current-password" placeholder="Mật khẩu" enterkeyhint="go" autocapitalize="off" autocorrect="off" spellcheck="false">
        <div id="lockErr" class="err" role="alert"></div>
        <button id="lockBtn" class="btn primary lg" type="submit">Mở khoá</button>
      </form>
      <button id="lockForgot" class="link" type="button">Quên mật khẩu?</button>
    </div>
  </div>

  <div id="toast" role="status"></div>
  <input type="file" id="importFile" accept="application/json,.json" hidden>

  <script src="vault.js"></script>
  <script src="logic.js"></script>
  <script src="app.js"></script>
</body>
</html>
